name: Build books and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.15.0
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - name: Install site dependencies
        run: npm ci
      - name: Build downloadable books
        run: npm run books:build
      - name: Build the website and search index
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
